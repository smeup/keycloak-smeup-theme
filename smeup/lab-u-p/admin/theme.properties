# Keycloak v2 theme — Admin Console (smeup-lab)
parent=keycloak.v2
import=common/keycloak
darkMode=true
styles=css/quick-start.css css/styles.css

# Logo in alto a sinistra (path relativo a resources/public)
# NB: su alcune versioni recenti c'e' un bug noto (issue keycloak/keycloak#45733)
# per cui il logo da theme.properties non viene mostrato nell'Admin Console.
# Se non lo vedi comparire, usa il fallback CSS gia' presente in css/styles.css
# (regola commentata "fallback logo via CSS").
logo=/public/logo.png
logoUrl=https://www.smeup.com

# Favicon
favIcon=/public/favicon.ico
favIconType=image/x-icon
