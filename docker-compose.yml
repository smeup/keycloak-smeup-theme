services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.6.1
    container_name: keycloak-smeup-local
    command:
      - start-dev
      - --http-port=8080
      - --spi-theme-static-max-age=-1
      - --spi-theme-cache-themes=false
      - --spi-theme-cache-templates=false
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8080:8080"
    volumes:
      - ./smeup/prod:/opt/keycloak/themes/prod:ro
      - ./smeup/lab:/opt/keycloak/themes/lab:ro
      - ./customers/università-udine:/opt/keycloak/themes/uni:ro
      - ./smeup/prod-v2:/opt/keycloak/themes/prod-v2:ro
      - ./smeup/lab-v2:/opt/keycloak/themes/lab-v2:ro